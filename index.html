<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Witchy's Inventions</title>
  <link rel="icon" type="image/png" href="favicon.png">
 
  <!-- Open Graph preview -->
  <meta property="og:title" content="Witchy's Inventions">
  <meta property="og:description" content="The Future is Witchy's!">
  <meta property="og:image" content="https://witchys.net/witchylogo.png">
  <meta property="og:url" content="https://witchys.net">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
 
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
 
    html, body {
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: "Times New Roman", Times, serif;
      color: #000000;
      text-align: center;
    }
 
    /* ── Nav ── */
    .nav {
      position: fixed;
      top: 16px;
      right: 20px;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
 
    .nav a {
      color: #0000EE;
      text-decoration: none;
      border-bottom: 1px solid #0000EE;
    }
 
    .nav a:hover {
      color: #0000AA;
      border-bottom-color: #0000AA;
    }
 
    .page-wrapper {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 10px;
    }
 
    /* ── Logo ── */
    .site-logo {
      display: block;
      height: 40vh;
      max-height: 300px;
      width: auto;
    }
 
    /* ── Subheader ── */
    .site-subheader {
      font-style: italic;
      font-weight: normal;
      font-size: 18px;
    }
 
    /* ── Contact ── */
    .contact-section {
      margin-top: 4px;
    }
 
    .contact-email {
      font-size: 15px;
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 1px;
    }
 
    .contact-email a {
      color: #0000EE;
      text-decoration: underline;
    }
 
    .contact-email a:hover {
      color: #0000AA;
    }
 
    /* ── Footer ── */
    .footer {
      margin-top: 8px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #cccccc;
      font-family: "Courier New", Courier, monospace;
    }
  </style>
</head>
<body>
 
  <div class="nav"><a href="about.html">About</a></div>
 
  <div class="page-wrapper">
 
    <!-- Logo -->
    <img src="witchylogo.png" alt="Witchy's Inventions Logo" class="site-logo">
 
    <!-- Subheader -->
    <div class="site-subheader">&ldquo;The Future is Witchy's!&rdquo;</div>
 
    <!-- Contact -->
    <div class="contact-section">
      <div class="contact-email">
        <img src="email_gif.gif" alt="email" width="28" style="vertical-align: middle; margin-right: 6px;"><a href="mailto:talk2witchy@aol.com">talk2witchy@aol.com</a>
      </div>
    </div>
 
    <!-- Footer -->
    <div class="footer">
      &copy; 2026 Witchy's Inventions
    </div>
 
  </div>
 
</body>
</html>
